name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      metrev_unpaywall_email:
        description: Public contact email for Unpaywall metadata requests.
        required: false
        default: metadata@metrev.local
        type: string
  workflow_call:
    inputs:
      metrev_unpaywall_email:
        description: Public contact email for Unpaywall metadata requests.
        required: false
        default: metadata@metrev.local
        type: string
    secrets:
      METREV_CI_AUTH_SECRET:
        required: false
      METREV_LLM_API_KEY:
        required: false
      OLLAMA_API_KEY:
        required: false

permissions:
  contents: read

env:
  AUTH_SECRET: ${{ secrets.METREV_CI_AUTH_SECRET || 'metrev-ci-auth-secret-for-validation-only' }}
  METREV_LLM_MODE: 'stub'
  METREV_LLM_API_KEY: ${{ secrets.METREV_LLM_API_KEY }}
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  METREV_UNPAYWALL_EMAIL: ${{ inputs.metrev_unpaywall_email || 'metadata@metrev.local' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Run workflow semantic lint
        run: pnpm run lint:workflow-semantics

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run fast validation matrix
        run: pnpm run validate:fast

      - name: Check workflow formatting
        run: pnpm run format:workflow-assets

      - name: Validate Docker Compose
        run: docker compose config

  validate-postgres:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: metrev
          POSTGRES_USER: metrev
          POSTGRES_PASSWORD: metrev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrev -d metrev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://metrev:metrev@localhost:5432/metrev?schema=public
      DIRECT_URL: postgresql://metrev:metrev@localhost:5432/metrev?schema=public
      METREV_STORAGE_MODE: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run Postgres migration and persistence validation
        run: pnpm run validate:db

  validate-local:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run local-view smoke validation
        run: pnpm run validate:local:smoke

      - name: Run local acceptance matrix
        run: pnpm run validate:local
        env:
          METREV_SKIP_LOCAL_SMOKE: '1'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Stop local-view stack
        if: always()
        run: pnpm run local:view:down

  validate-advanced:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run deterministic advanced validation matrix
        run: pnpm run validate:advanced
