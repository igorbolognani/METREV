name: Numerical regression

on:
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Execute 2D and 3D MFC/MEC refinement and record coarse performance
        run: python scripts/run-spatial-verification.py --mode=full
      - name: Run complete native numerical and contract regression
        run: python scripts/run-spatial-contract-tests.py --mode=full
      - name: Preserve scope-bound refinement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: numerical-refinement-evidence
          path: test-results/numerical-verification/
          if-no-files-found: error
