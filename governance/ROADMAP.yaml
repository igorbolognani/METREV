    blockers:
      - Versioned spatial result manifests are persisted and returned by the authenticated spatial API; P02/P04 remain partial, field reads lack a production provider and the viewer is absent
      - Input-bound results preserve the admitted mesh digest, geometry version, refinement, generator and physical-group map; manifested region kinds/components, boundary roles and oriented interfaces must match that input
      - Returned state fields must contain every requested variable or explicitly composed planar x/y velocity vector and no unrequested variable; independent derived metrics and broader vector output authority beyond planar velocity remain pending
      - The explicit development worker has restricted Darcy-transport and single-liquid Stokes adapters that project solver fields into input-bound result-v2 manifests using owner-scoped local stores; CI verifies both through the pinned native worker/API path, while production artifact storage, the viewer, and application solver admission remain pending
    gate_evidence:
      GATE-CONTRACT: spatial-simulation-result-v2 rejects inconsistent domains, field references, hash lists, metric derivations and completion identity; v1 result snapshots remain readable, while new input-bound persistence requires v2 and checks mesh topology and requested state outputs
      GATE-PROVENANCE: result and scalar outputs bind to run, model, input hash and content-addressed mesh/field references
      GATE-UNITS: field state units are checked against authority-validated immutable input before completed or failed persistence; integral units are checked against field units and Cartesian mesh dimension, while axisymmetric domain-volume and boundary-area integrals use the physical 3D measure; scalar and planar velocity-component metrics must declare a field statistic and match its value and unit
