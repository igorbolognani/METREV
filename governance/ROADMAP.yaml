    blockers:
      - A test-only synthetic exact three-layer scalar diffusion solve now checks nodal values and boundary/interface flux on tagged planar meshes at factors 1, 2, and 4; source-traced per-layer target sizes provide local refinement while sharing conforming interface points. A separate manufactured-source three-layer diffusion case now has native L2 convergence and conservative weak boundary-reaction evidence; broader numerical cell geometries and product solver behavior remain pending
      - P04 deployment gate, product authorization and durable artifact provider pending
    gate_evidence:
      GATE-MESH-REFINEMENT: Coarse/medium/fine meshes at refinement factors 1, 2, and 4 preserve per-region triangle-integrated area and physical boundary/interface lengths and positions against analytic planar geometry within a 1e-10 relative tolerance; a test-only tagged three-layer diffusion solve also checks exact nodal values and boundary/interface flux at each size; these geometric/affine checks do not claim PDE convergence. A separate synthetic piecewise-quadratic source fixture passed pinned DOLFINx/Gmsh CI run 37618038756 on head 397f0a374c4a519184429ac7e57624ae996adfb9 with 92/252/962 cells, relative L2 errors 1.4726456365465735e-4/6.297088810599977e-5/1.1100533418288686e-5, equivalent-h orders 1.686/2.591 and weak-residual source-boundary balance below 4e-14. This is restricted numerical verification, not empirical validation or product solver admission
      GATE-PROVENANCE: Per-layer local mesh sizes require source-traced positive SI lengths and are bound into the immutable input and mesh request digest; the pinned Gmsh fixture checks added biofilm cells and preserved physical groups
  - id: P06
    title: Implement a conservative spatial mathematical core
    phase: P2
    status: partial
    depends_on:
      - P03
      - P05
    required_gates:
      - GATE-CONTRACT
      - GATE-MASS-CONSERVATION
      - GATE-NONLINEAR-CONVERGENCE
    source_section: '28.6'
    completion_requires:
      All requirements in source_section; status promotion requires gate evidence and product
      integration where applicable.
    workstream: numerics_and_physics
    affected_layers:
      - science
      - contracts
      - runtime
    owned_paths:
      - packages/
      - apps/
    blockers:
      - An isolated scalar finite-volume kernel has bounded steady, transient, heterogeneous-interface and prescribed constant/cellwise divergence-checked velocity verification on 1D/2D/3D orthogonal grids; it remains disconnected from Gmsh and simulation cases. The shared DOLFINx neutral scalar kernel transfers solved Stokes/Darcy velocity on one tagged domain; the mesh benchmark is not a product solver or cell physics; P03 and P05 remain partial
      - Linear first-order disappearance, constant grid-aligned diagonal diffusivity and mixed Dirichlet/prescribed diffusive-flux and heterogeneous porous-storage fixtures are verified on orthogonal grids; the separate structured-cell development runtime implements steady species/reaction/charge/interface/circuit assembly and sparse Newton in 2D/3D. Boundary-driven Darcy pressure and velocity now couple to structured-cell species transport; the shared DOLFINx scalar kernel remains separate. Full electroneutral closure, charged membrane interfaces, broader coupled verification and product integration remain pending
    gate_evidence:
      GATE-NEUTRAL-PARTITION: A versioned, source-traced interface contract supports an explicitly oriented ideal partition coefficient for declared neutral species across adjacent membrane/separator domains. Local 2D/3D tests check analytic flux, zero-flux equilibrium, conservative shared-face balance and Jacobian directional derivatives. The full numerical runner now also executes MFC/MEC with two partition interfaces on three all-axis meshes, native conservation, positivity, coupled current and concentration changes, transverse variation and the K=1 continuous-interface limit. Interface fluxes remain diagnostics; no exact convergence order, charged partition, Donnan equilibrium, full electroneutral closure, empirical validation or product solver admission is claimed
      GATE-SCALAR-SOURCE-LOSS: The shared native same-domain Stokes/Darcy scalar kernel supports sourced constant production and first-order loss; analytic production/loss/equilibrium fixtures refine on three meshes and native worker/API cases persist an input-bound measured species budget. This does not close charge, network, interface or nonlinear cell gates
      GATE-MASS-CONSERVATION: A scalar finite-volume fixture checks integrated source and first-order disappearance against prescribed diffusive and upwind advective boundary flux and verifies affine isotropic/diagonal-anisotropic, manufactured and two-material interface solutions in 1D/2D/3D; this is not coupled species/charge conservation
      GATE-TIME-REFINEMENT: Implicit-Euler scalar diffusion fixtures in 2D and 3D compare three step sizes with a finer numerical reference and check storage plus flux balance; no transient cell model is verified
      GATE-LIMITING-CASE: a manufactured incompressible cellwise shear velocity and affine scalar concentration/source refine on three orthogonal-grid levels in 2D/3D, preserve integrated species balance and transient constant state, and reject nonzero discrete divergence; velocity remains prescribed rather than solved
  - id: P07
    title: Implement 2D hydraulics
    phase: P2
    status: partial
    depends_on:
      - P05
      - P06
    required_gates:
      - GATE-CONTRACT
      - GATE-MASS-CONSERVATION
      - GATE-NONLINEAR-CONVERGENCE
