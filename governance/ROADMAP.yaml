      - runtime
    owned_paths:
      - packages/
      - apps/
    blockers:
      - An isolated scalar finite-volume kernel has bounded steady, transient, heterogeneous-interface and prescribed-velocity verification on 1D/2D/3D orthogonal grids; P03 and P05 remain partial and it is not connected to Gmsh or a case
      - A linear first-order disappearance fixture is verified on orthogonal grids, but electrochemical reaction networks, solved hydraulics, electromigration, electrolyte and solid charge, physical region interfaces, circuit closure and nonlinear convergence remain unimplemented in spatial runtime
    gate_evidence:
      GATE-MASS-CONSERVATION: A scalar finite-volume fixture checks integrated source and first-order disappearance against diffusive and upwind advective boundary flux and verifies affine, manufactured and two-material interface solutions in 1D/2D/3D; this is not coupled species/charge conservation
      GATE-TIME-REFINEMENT: Implicit-Euler scalar diffusion fixtures in 2D and 3D compare three step sizes with a finer numerical reference and check storage plus flux balance; no transient cell model is verified
