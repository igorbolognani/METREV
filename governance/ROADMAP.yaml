    workstream: numerics_and_physics
    affected_layers:
      - science
      - contracts
      - runtime
    owned_paths:
      - packages/
      - apps/
    blockers:
      - The restricted structured-cell worker now admits a versioned steady boundary-driven Darcy pressure solve on its orthogonal 2D/3D layered mesh, with scalar region-wise permeability, pressure/no-flow transverse boundaries, local volume-balance checks, and solved velocity coupled to species transport. The authenticated case evaluation path carries an explicitly supplied Darcy input through planning, queueing, the worker, and persisted result fields; it does not infer viscosity, permeability, or boundary conditions from the case record. Bulk-liquid/porous interface laws, Brinkman and Navier–Stokes regimes, broader hydraulic constitutive laws, and production solver registration remain unimplemented
      - P05/P06 remain partial; the new transport fixture does not establish multi-region interface conservation, and production field persistence/API/UI integration remains pending
    gate_evidence:
      GATE-CONTRACT: the pinned Gmsh fixture preserves explicit bulk-liquid, no-slip wall, inlet and outlet physical groups; restricted development inputs bind source-traced constant viscosity and pressure, complete exterior roles, and typed worker requests to selected mesh digests. The structured-cell contract retains prescribed-pressure compatibility and adds a versioned boundary-driven pressure-solve mode with complete region permeability and explicit transverse pressure/no-flow roles. Case composition enables hydraulics only when the request declares the module and supplies the complete source-backed Darcy block; the authenticated case route then uses the opt-in development executor, not a production solver catalog
      GATE-MASS-CONSERVATION: the Taylor–Hood Stokes fixture matches analytic planar Poiseuille velocity and pressure across three refinements; a homogeneous porous Darcy fixture checks exact linear pressure, uniform Darcy velocity, analytic pressure-driven flow and integrated inlet/outlet balance. The structured-cell pressure solve also reconstructs analytic 2D/3D pressure and conservative face velocity across regions with distinct scalar permeabilities, then carries those fields through both the cell worker and authenticated saved-case evaluation path. The case worker test verifies persisted pressure/velocity artifacts and the local fluid-volume residual. A separate same-mesh Darcy-to-neutral-scalar fixture checks an analytic Pe=1 advection–diffusion profile and integrated inlet/outlet/wall species-flux balance. These development fixtures are not product-coupled
      GATE-NONLINEAR-CONVERGENCE: the benchmark is linear Stokes, so nonlinear convergence is not applicable; its PETSc direct solve fails on nonconvergence, while coupled nonlinear product solvers remain unimplemented
      GATE-LIMITING-CASE: parameterized synthetic Poiseuille flow on three tagged refinements checks analytic velocity and pressure, positive inlet/outlet flow, pressure drop, PETSc convergence reason and divergence diagnostics; viscosity and pressure drop are varied without claiming product hydraulics
