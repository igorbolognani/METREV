  - id: P05
    title: Build geometry and mesh infrastructure before broad 2D physics
    phase: P2
    status: partial
    depends_on:
      - P04
    required_gates:
      - GATE-CONTRACT
      - GATE-MESH-REFINEMENT
    source_section: '28.5'
    completion_requires:
      All requirements in source_section; status promotion requires gate evidence and product
      integration where applicable.
    workstream: numerics_and_physics
    affected_layers:
      - science
      - contracts
      - runtime
    owned_paths:
      - packages/
      - apps/
    blockers:
      - A test-only synthetic exact three-layer scalar diffusion solve now checks nodal values and boundary/interface flux on tagged planar meshes at factors 1, 2, and 4; source-traced per-layer target sizes provide local refinement while sharing conforming interface points. PDE convergence evidence, broader numerical cell geometries and product solver behavior remain pending
      - P04 deployment gate, product authorization and durable artifact provider pending
    gate_evidence:
      GATE-MESH-REFINEMENT: Coarse/medium/fine meshes at refinement factors 1, 2, and 4 preserve per-region triangle-integrated area and physical boundary/interface lengths and positions against analytic planar geometry within a 1e-10 relative tolerance; a test-only tagged three-layer diffusion solve also checks exact nodal values and boundary/interface flux at each size; neither check claims PDE solution convergence
      GATE-PROVENANCE: Per-layer local mesh sizes require source-traced positive SI lengths and are bound into the immutable input and mesh request digest; the pinned Gmsh fixture checks added biofilm cells and preserved physical groups
  - id: P06
    title: Implement a conservative spatial mathematical core
    phase: P2
    status: partial
    depends_on:
      - P03
      - P05
    required_gates:
      - GATE-CONTRACT
      - GATE-MASS-CONSERVATION
      - GATE-NONLINEAR-CONVERGENCE
    source_section: '28.6'
    completion_requires:
      All requirements in source_section; status promotion requires gate evidence and product
      integration where applicable.
    workstream: numerics_and_physics
    affected_layers:
      - science
      - contracts
      - runtime
    owned_paths:
      - packages/
      - apps/
    blockers:
      - An isolated scalar finite-volume kernel has bounded steady, transient, heterogeneous-interface and prescribed constant/cellwise divergence-checked velocity verification on 1D/2D/3D orthogonal grids; it remains disconnected from Gmsh and simulation cases. The test-only DOLFINx mesh benchmark is not a product solver or cell physics; P03 and P05 remain partial
      - Linear first-order disappearance, constant grid-aligned diagonal diffusivity and mixed Dirichlet/prescribed diffusive-flux and heterogeneous porous-storage fixtures are verified on orthogonal grids; electrochemical reaction networks, solved hydraulics, electromigration, electrolyte and solid charge, physical region interfaces, circuit closure and nonlinear convergence remain unimplemented in spatial runtime
    gate_evidence:
      GATE-MASS-CONSERVATION: A scalar finite-volume fixture checks integrated source and first-order disappearance against prescribed diffusive and upwind advective boundary flux and verifies affine isotropic/diagonal-anisotropic, manufactured and two-material interface solutions in 1D/2D/3D; this is not coupled species/charge conservation
      GATE-TIME-REFINEMENT: Implicit-Euler scalar diffusion fixtures in 2D and 3D compare three step sizes with a finer numerical reference and check storage plus flux balance; no transient cell model is verified
      GATE-LIMITING-CASE: a manufactured incompressible cellwise shear velocity and affine scalar concentration/source refine on three orthogonal-grid levels in 2D/3D, preserve integrated species balance and transient constant state, and reject nonzero discrete divergence; velocity remains prescribed rather than solved
  - id: P07
    title: Implement 2D hydraulics
    phase: P2
    status: partial
    depends_on:
      - P05
      - P06
    required_gates:
      - GATE-CONTRACT
      - GATE-MASS-CONSERVATION
      - GATE-NONLINEAR-CONVERGENCE
    source_section: '28.7'
    completion_requires:
      All requirements in source_section; status promotion requires gate evidence and product
      integration where applicable.
    workstream: numerics_and_physics
    affected_layers:
      - science
      - contracts
      - runtime
    owned_paths:
      - packages/
      - apps/
    blockers:
      - Restricted bulk-liquid Stokes and homogeneous single-porous-domain Darcy operations write hash-checked pressure/velocity fields and verify analytic fixtures independently. A separate development operation now transfers solved Darcy velocity to one neutral passive scalar on the same porous mesh and checks an analytic advection–diffusion profile and species-flux balance. Product hydraulics remains unregistered; bulk/porous interface coupling, heterogeneous Darcy/Brinkman, Navier–Stokes regimes, reactive or ionic transport coupling and case-runner integration remain unimplemented
      - P05/P06 remain partial; the new transport fixture does not establish multi-region interface conservation, and production field persistence/API/UI integration remains pending
    gate_evidence:
      GATE-CONTRACT: the pinned Gmsh fixture preserves explicit bulk-liquid, no-slip wall, inlet and outlet physical groups; a restricted development input binds source-traced constant viscosity, pressure and x/y velocity states, complete exterior roles and full traction components. A typed worker request is bound to that input and the selected regenerated mesh digest; it does not establish product hydraulic input or solver admission
      GATE-MASS-CONSERVATION: the Taylor–Hood Stokes fixture matches analytic planar Poiseuille velocity and pressure across three refinements; a homogeneous porous Darcy fixture checks exact linear pressure, uniform Darcy velocity, analytic pressure-driven flow and integrated inlet/outlet balance. A separate same-mesh Darcy-to-neutral-scalar fixture checks an analytic Pe=1 advection–diffusion profile and integrated inlet/outlet/wall species-flux balance. These development fixtures are not product-coupled
      GATE-NONLINEAR-CONVERGENCE: the benchmark is linear Stokes, so nonlinear convergence is not applicable; its PETSc direct solve fails on nonconvergence, while coupled nonlinear product solvers remain unimplemented
      GATE-LIMITING-CASE: parameterized synthetic Poiseuille flow on three tagged refinements checks analytic velocity and pressure, positive inlet/outlet flow, pressure drop, PETSc convergence reason and divergence diagnostics; viscosity and pressure drop are varied without claiming product hydraulics
