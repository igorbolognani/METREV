lower_dimensional_reaction_coverage:
  0D:
    law: EQ-BIO-001_lumped_Monod_on_COD_basis
    runtime_binding: implemented_with_EQ-RX-002_electron_equivalent_mapping
    numerical_verification: partial
    numerical_verification_remaining_gates:
      [GATE-POSITIVITY, GATE-NONLINEAR-CONVERGENCE]
    remaining_limits:
      [
        no_molecular_products,
        no_proton_or_side_reaction_stoichiometry,
        no_independent_validation,
      ]
  1D:
    law: EQ-BIO-002_restricted_steady_porous_anode_Nernst_Monod
    runtime_binding: restricted_with_source_traced_electron_equivalents
    numerical_verification: partial
    numerical_verification_remaining_gates:
      [GATE-POSITIVITY, GATE-MESH-REFINEMENT, GATE-NONLINEAR-CONVERGENCE]
    case_output_relevance: informational_development_only
    case_output_relevance_exit_gates:
      [GATE-EXPERIMENTAL-COMPARISON, GATE-INDEPENDENT-VALIDATION]
    restriction_exit_requires:
      [
        molecular_species_and_product_stoichiometry,
        proton_balance_and_pathway_accounting,
        resolved_or_explicitly_validated_anode_potential,
        membrane_concentration_polarization_and_multicomponent_transport_beyond_uniform_binary_family,
