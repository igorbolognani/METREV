notes:
  - Baseline main SHA is immutable; use git rev-parse and fetch to inspect live state.
  - Catalog status is execution availability, separate from scientific maturity.
  - The local mesh adapter verifies sidecar hashes and owner-scoped reads; it is not a production storage provider or product authorization path.
  - Spatial job creation and retries fail closed by default; operator-configured development adapters can admit their exact supported input. No production
    field-artifact provider or general 2D/3D catalog solver is registered.
  - The spatial worker bounds its asynchronous wait even if an executor ignores AbortSignal; the sidecar client terminates its isolated process group on cancellation
    or timeout; service shutdown aborts the active executor and records worker_shutdown without cancelling queued jobs. An explicit per-run container profile
    enforces bounded CPU/memory/PID/temp limits; deployment of the worker, database and production artifact store remains pending.
  - Worker runs emit structured claim, progress, completion, failure, cancellation, and lease-loss events; known sidecar failures persist stable safe codes
    without stderr or local-path details.
