version: 0.1
evidence_record:
  required_fields:
    - evidence_id
    - evidence_type
    - title
    - summary
    - applicability_scope
    - strength_level
    - provenance_note
  optional_fields:
    - quantitative_metrics
    - operating_conditions
    - block_mapping
    - limitations
    - contradiction_notes
    - supplier_name
    - benchmark_context
    - tags
    - accepted_by
    - acceptance_policy
    - accepted_at
    - review_required
    - ingestion_mode
    - ingestion_batch_id
    - extraction_status
    - normalization_status
    - evidence_quality

scientific_decision_database_layers:
  raw_evidence:
    purpose: Preserve article/source metadata, provenance, original payload, ingestion batch, and audit trail.
  extracted_scientific_facts:
    purpose: Store article-derived technical facts such as BES/MFC/MEC system type, materials, membranes, biology, operating conditions, metrics, scale, TRL, limitations, and failure modes.
  normalized_comparison:
    purpose: Preserve original values while adding canonical units, material names, ontology mappings, confidence, missing-data flags, and uncertainty.
  benchmark:
    purpose: Support comparison by system type, component, material, operating condition, metric, year, maturity, evidence quality, scale, and cost/risk proxy.
  decision_support:
    purpose: Retrieve relevant evidence slices for stack diagnosis, benchmarking, and recommendations before any LLM narrative is generated.

evidence_decision_context:
  purpose: Server-built decision-support context assembled after case normalization and before deterministic scoring or LLM narrative generation.
  required_fields:
    - case_id
    - technology_family
    - system_type
    - primary_objective
    - query
    - benchmark_ranges
    - matched_evidence
    - uncertainty_summary
    - provenance_note
    - source_refs
    - builder_version
  signal_groups:
    - material_comparisons
    - operating_window_signals
    - failure_mode_signals
    - cost_signals
    - supplier_signals
    - regulatory_social_signals
  matched_evidence_trace_fields:
    - catalog_item_id
    - source_record_id
    - review_status
    - source_state
    - access_status
    - canonical_key
    - metric_type
    - normalized_value
    - normalized_unit
    - evidence_quality
    - source_text_hash
    - source_locator
  admissibility:
    admitted_when:
      - review_status_accepted
      - decision_ready_true
      - normalization_completed
      - source_text_hash_present
      - source_locator_or_span_present
      - source_license_or_access_policy_allows_decision_use
      - evidence_quality_not_low
      - supplier_claim_is_corroborated_or_kept_as_supplier_signal
    excluded_when:
      - review_status_pending_or_rejected
      - decision_ready_false
      - missing_required_unit_for_numeric_metric
      - missing_source_text_hash
      - missing_source_locator_or_span
      - closed_access_policy
      - low_trace_quality
      - low_evidence_quality
      - supplier_claim_without_independent_corroboration
  rule_engine_use:
    - benchmark ranges may change recommendation priority, confidence, and validation actions when comparable context exists
    - weak or conflicting evidence lowers confidence and creates next-test actions
    - supplier claims remain separated from validated evidence and cannot increase confidence without corroboration

enums:
  source_type:
    - openalex
    - crossref
    - europe_pmc
    - paper
    - review
    - patent
    - datasheet
    - manual_sop
    - technical_report
    - supplier_document
    - supplier_profile
    - case_study
    - market_report
    - market_snapshot
    - regulatory_report
    - curated_manifest
    - manual
  evidence_type:
    - literature_evidence
    - internal_benchmark
    - supplier_claim
    - engineering_assumption
    - derived_heuristic
  strength_level:
    - weak
    - moderate
    - strong

guidance:
  literature_evidence:
    use_when: External scientific or technical literature is the primary source.
    caution: Applicability may be narrow and context transfer must be explicit.
  internal_benchmark:
    use_when: Project-owned measurement, historical case, or benchmark result is the source.
    caution: Do not over-generalize beyond matching context.
  supplier_claim:
    use_when: A vendor or supplier provided the claim directly.
    caution: Never present as established fact without validation or corroboration.
  engineering_assumption:
    use_when: A practical engineering assumption is needed to keep evaluation moving.
    caution: Must be visible in output and should reduce confidence when material.
  derived_heuristic:
    use_when: A reusable internal heuristic is inferred from accumulated evidence.
    caution: Must reference its supporting logic and applicability scope.

applicability_scope_fields:
  - technology_family
  - stack_block
  - influent_or_feed_context
  - operating_regime
  - scale_context
  - objective_context

provenance_requirements:
  - source_category
  - source_note
  - date_or_version_if_known
  - applicability_scope
  - limitations
  - ingestion_batch_id
  - acceptance_policy
  - duplicate_decision_when_skipped

acceptance_policy:
  trusted_scientific_corpus_v1:
    accepted_by: system
    review_status: accepted
    review_required: false
    applies_when:
      - schema_validation_passed
      - provenance_present
      - normalization_completed
      - duplicate_conflicts_absent
      - extraction_confidence_not_low
      - source_type_is_trusted_scientific_corpus
    exception_queue_when:
      - schema_validation_failed
      - required_fields_missing
      - provenance_missing
      - malformed_record
      - normalization_failed
      - low_extraction_confidence
      - duplicate_conflict_requires_human_decision
