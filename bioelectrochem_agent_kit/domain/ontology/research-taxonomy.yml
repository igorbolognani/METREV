version: 0.1
domain: bioelectrochemical-research-intelligence
scope:
  primary_technologies:
    - MFC
    - MEC
    - electrochemical_biosensor
  source_role: literature_review_and_evidence_pack_generation
  downstream_boundary: bioelectrochemical_decision_support
  supported_source_types:
    literature:
      - paper
      - review
      - thesis_or_dissertation
    research_data:
      - dataset
    intellectual_property:
      - patent
    technical_documentation:
      - datasheet
      - manual_sop
      - technical_report
      - supplier_document
    deployment_and_market:
      - case_study
      - market_report
      - regulatory_report
  active_surface_eligibility:
    required_access:
      - full_text_html
      - full_text_xml
      - accessible_pdf
      - locally_imported_full_text
    required_technology_scope:
      - MFC
      - MEC
      - electrochemical_biosensor
    excluded_when:
      - closed_access
      - unknown_access_without_license_or_policy
      - missing_full_text_link_or_artifact
      - source_is_only_supplier_market_or_regulatory_context
      - source_does_not_address_MFC_MEC_or_electrochemical_biosensor
  research_lenses:
    - electroactive_biology
    - redox_reactor_engineering
    - materials_interfaces
    - resource_recovery_outputs
    - environmental_operating_context
    - adoption_readiness
    - evidence_provenance
    - data_metadata_readiness
    - mechanistic_parameterization
    - biosensor_analytical_performance

application_areas:
  wastewater_treatment:
    description: Wastewater composition, treatment trains, COD removal, effluent quality, process integration, and operational stability.
  biosensing:
    description: Standalone and MFC/MEC-integrated electrochemical biosensors for wastewater analytes, calibration, and validation.
  coupled_system_modeling:
    description: Mechanistic reactor, material, biological, electrochemical, transport, and sensor parameterization.
  electrode_materials:
    description: Anode, cathode, catalyst, separator, surface modification, durability, and procurement signals.

historical_or_secondary_applications:
  hydrogen_recovery: MEC hydrogen is a modeled secondary output, not a separate active product direction.
  nutrient_recovery: Preserve existing cases and evidence as historical or secondary context pending a focused model.
  co2_valorisation: Outside the active MFC/MEC wastewater and electrochemical-biosensor scope.
  desalination: Outside the active MFC/MEC wastewater and electrochemical-biosensor scope.
  bioremediation: Outside the active MFC/MEC wastewater and electrochemical-biosensor scope.
  industrial_bioproduction: Outside the active MFC/MEC wastewater and electrochemical-biosensor scope.
  industrial_adoption: Retain cost and maturity fields as system constraints, not as the primary research taxonomy.

review_column_groups:
  identification:
    description: Paper identity, citation metadata, and access posture.
  synthesis:
    description: Short summaries derived from source text only.
  scientific_structure:
    description: Objectives, methods, results, findings, variables, and sample descriptions.
  application:
    description: Technology class, application, scale, and deployment context.
  limitations:
    description: Challenges, research gaps, future work, and implementation limits.
  bioelectrochemistry:
    description: Reactor, materials, microorganisms, substrate, electrolyte, BOP, and instrumentation details.
  metrics:
    description: Electrochemical, treatment, product, and efficiency measurements with units and source spans.
  data_readiness:
    description: Metadata completeness, signal quality, contextual annotations, lineage, and downstream use readiness.
  decision:
    description: TRL, scalability, cost signal, supplier relevance, implementation risk, and evidence confidence.

technical_detail_sections:
  - technology
  - reactor
  - anode
  - cathode
  - membrane_or_separator
  - biology
  - substrate
  - operating_conditions
  - electrochemical_metrics
  - treatment_outputs
  - energy_or_product_outputs
  - limitations
  - cost_scale_maturity
  - evidence_trace
  - data_metadata_readiness
  - metadata_quality
  - evidence_veracity
  - eligibility_audit
  - component_parameters
  - component_profiles
  - mechanistic_model_input_set
  - biosensor_calibration_and_validation

scientific_component_parameters:
  required_trace_fields:
    - original_value
    - original_unit
    - normalized_value
    - normalized_unit
    - normalization_rule_id
    - source_locator
    - text_span
  component_types:
    - reactor
    - anode
    - cathode
    - membrane_separator
    - catalyst
    - current_collector
    - biofilm
    - inoculum_microbial_community
    - substrate_feedstock
    - electrolyte
    - external_circuit
    - sensors_instrumentation
    - biosensor_recognition_element
    - biosensor_working_reference_counter_electrodes
    - balance_of_plant
  parameter_kinds:
    - material
    - geometry
    - surface_property
    - loading
    - operating_condition
    - electrochemical_metric
    - treatment_metric
    - product_metric
    - biology
    - cost_maturity
    - limitation
    - kinetic_parameter
    - electrochemical_parameter
    - mass_transfer_parameter
    - sensor_calibration_parameter
    - analytical_performance_parameter

metrev_research_lens_mapping:
  electroactive_biology:
    stack_blocks: [operational_biology]
  redox_reactor_engineering:
    stack_blocks:
      [
        reactor_architecture,
        electrical_interconnect_and_sealing,
        balance_of_plant,
      ]
  materials_interfaces:
    stack_blocks:
      [anode_biofilm_support, cathode_catalyst_support, membrane_or_separator]
  resource_recovery_outputs:
    outputs:
      [treatment_outputs, energy_or_product_outputs, operating_conditions]
  environmental_operating_context:
    outputs: [treatment_outputs, operating_conditions]
  adoption_readiness:
    outputs: [risk_and_maturity, technoeconomics, phased_roadmap]
  evidence_provenance:
    outputs: [evidence_trace, metadata_quality, evidence_veracity]
  data_metadata_readiness:
    outputs: [metadata_quality, evidence_veracity, evidence_trace]

rules:
  - Research extraction must preserve source text spans for every non-null claim.
  - Table and figure-derived claims must preserve block type, source locator, table or figure id, and row or caption context when available.
  - Evidence traces must preserve text span, page, section, table or figure label, cell locator, caption, and source locator together when those fields are available.
  - Numerical values must retain original unit, normalized unit, source span, and normalization rule id when converted.
  - Missing fields remain explicit and must not be filled through LLM inference.
  - Evidence packs are decision-support inputs only after schema validation and analyst-visible confidence review.
  - EvidenceDecisionContext is built by the API/database decision layer, not by review UI state, and may admit only decision-ready evidence.
  - Context or methodology references may inform vocabulary, metadata organization, and evidence targeting but must not be treated as validated stack performance evidence.
  - Metadata quality and evidence veracity are distinct review dimensions and both must remain audit-visible.
  - Warehouse eligibility sweeps may mark active sources only when sources are full-access, traceable, and explicitly in MFC, MEC, electrochemical-biosensor, or in-scope wastewater applications.
  - Eligibility filtering must preserve excluded source records and reason buckets for audit instead of deleting source rows.
  - Papers, reviews, datasets, patents, datasheets, manuals, SOPs, supplier documents, case studies, market reports, and regulatory reports must remain typed source documents; only decision-ready evidence can cross into decision inputs.
  - Component profiles must not hide defaults: missing material, geometry, surface, loading, biology, and operating fields stay visible in missing_fields.
