version: 0.1
domain: bioelectrochemical-decision-support
scope:
  primary_technologies:
    - microbial_fuel_cell
    - microbial_electrolysis_cell
    - electrochemical_biosensor
  normalization_only_values:
    - unclassified
  product_role: source_grounded_system_modeling_and_decision_support
  wastewater_role: wastewater_management_and_treatment
  biosensor_deployments:
    - standalone
    - integrated_with_MFC
    - integrated_with_MEC
  excluded_primary_scope:
    - real_time_closed_loop_plant_control
    - spatially_resolved_multiphysics_solver_until_validated

stack_blocks:
  reactor_architecture:
    description: Physical and functional configuration of the reactor system.
    example_subdomains:
      - single_chamber
      - dual_chamber
      - modular_stack
      - batch_operation
      - continuous_operation
  anode_biofilm_support:
    description: Anodic substrate, geometry, and biofilm-supporting environment.
    example_subdomains:
      - carbon_felt
      - carbon_cloth
      - graphite_brush
      - porous_carbon_monolith
      - conductive_polymer_composite
      - surface_modification
  cathode_catalyst_support:
    description: Cathodic substrate, catalyst family, and product-side interface conditions.
    example_subdomains:
      - oxygen_reduction_cathode
      - hydrogen_evolution_cathode
      - abiotic_cathode
      - biocathode
      - catalytic_layer
      - gas_handling_interface
  membrane_or_separator:
    description: Ion transport and/or separation layer, including membrane-free strategies.
    example_subdomains:
      - cation_exchange_membrane
      - anion_exchange_membrane
      - porous_separator
      - membrane_free_strategy
      - anti_crossover_design
  electrical_interconnect_and_sealing:
    description: Current collection, interconnects, contacts, sealing, and assembly interfaces.
    example_subdomains:
      - current_collector
      - busbar_or_contact
      - gasket
      - sealing_strategy
      - anti_corrosion_interface
  balance_of_plant:
    description: Pumps, valves, dosing, recirculation, gas handling, and auxiliary process hardware.
    example_subdomains:
      - liquid_pumping
      - gas_management
      - recirculation_loop
      - dosing_and_conditioning
      - safety_and_venting
      - cleaning_or_maintenance_path
  sensors_and_analytics:
    description: Process sensors and electrochemical biosensors, including standalone and reactor-integrated deployments.
    example_subdomains:
      - online_water_quality
      - electrochemical_diagnostics
      - biosensor_analyte_and_measurand
      - biorecognition_element
      - amperometric_calibration
      - working_range_lod_loq
      - selectivity_and_matrix_interference
      - response_recovery_time_and_drift
      - sensor_power_budget
      - voltage_current_logging
      - alarming
      - data_pipeline
      - laboratory_validation
  operational_biology:
    description: Inoculum, biofilm startup, microbial resilience, and biological operating regime.
    example_subdomains:
      - inoculum_strategy
      - startup_protocol
      - shock_response
      - substrate_utilization_profile
      - microbial_stability
      - contamination_or_competition_risk

mechanistic_model:
  authority: bioelectrochem_agent_kit/domain/rules/mechanistic-model.yml
  executable_model: packages/electrochem-models/src/mechanistic.ts
  version: coupled-0d-dae-v1
  coupled_domains:
    - wastewater_COD_and_biomass_mass_balance
    - temperature_and_pH_dependent_biological_kinetics
    - electrode_Butler_Volmer_charge_transfer
    - electrolyte_and_membrane_ionic_resistance
    - cathode_oxygen_mass_transfer
    - MFC_load_line_or_MEC_applied_voltage_boundary
    - chamber_proton_buffer_balance
  parameter_rule: All executed model parameters carry an SI unit, source kind, and source reference.

cross_cutting_layers:
  technoeconomics:
    description: Cross-cutting layer for CAPEX, OPEX, TCO, replacement cycles, and decision economics.
  evidence_and_provenance:
    description: Cross-cutting layer for evidence typing, source strength, and applicability.
  risk_and_maturity:
    description: Cross-cutting layer for TRL, operational risk, scale-up risk, and implementation readiness.

decision_outputs:
  - current_stack_diagnosis
  - prioritized_improvement_options
  - impact_map
  - supplier_shortlist
  - phased_roadmap
