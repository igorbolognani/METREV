version: structured-cell-equations-v1
status: implemented_restricted_development_mathematical_checks_only
model_id: structured-cell-supporting-electrolyte-v1
supported_dimensions: [2, 3]
state:
  concentration: { unit: mol/m3, domains: all_regions }
  liquid_potential: { unit: V, domains: all_regions }
  solid_potential: { unit: V, domains: anode_and_cathode }
  collector_voltage: { unit: V, reference: anode_collector_zero }
equations:
  - id: cell-species-steady-v1
    expression: div(N_i) = sum(nu_ir * r_r) + nu_ie * j_F / (n_e * F)
    flux: N_i = u * c_i - D_i * (grad(c_i) + z_i * F * c_i * grad(phi_l) / (R * T))
    method: Finite volumes with Scharfetter-Gummel diffusion/migration, harmonic diffusivity, and conservative first-order upwind convection when explicitly declared.
    boundary: x insulating; explicitly selected transverse reservoir faces impose diffusive species concentration. Source-backed prescribed inflow concentrations and solved upwind outflow states independently define convective boundary flux.
  - id: cell-neutral-membrane-partition-v1
    expression: J_n = A / (h_L / D_L + h_R / (K_RL * D_R)) * (c_L - c_R / K_RL)
    orientation: Positive from left_domain to right_domain along positive x; K_RL is the source-backed equilibrium right/left concentration ratio.
    domain: One explicitly declared interface adjacent to a membrane or separator; neutral species only.
    states: left and right neutral species concentrations in mol/m3; interface flux in mol/s.
    parameters: h_L and h_R in m; diffusivities in m2/s; partition ratio K_RL is dimensionless.
    assumptions: Zero-resistance ideal partition interface with bulk half-cell diffusion resistance; no charged Donnan closure or membrane water transport.
    boundary: This law replaces continuous-concentration diffusion only for listed neutral species; all shared-face contributions remain equal and opposite.
  - id: cell-liquid-charge-v1
    expression: div(-kappa * grad(phi_l)) = j_F
    boundary: No total ionic current across exterior faces; supporting electrolyte compensates trace species reservoir current.
  - id: cell-solid-charge-v1
    expression: div(-sigma * grad(phi_s)) = -j_F
    boundary: Fixed anode collector at zero and cathode collector at circuit voltage; all other electronic faces insulating.
  - id: cell-butler-volmer-v1
    expression: j_F = i0 * (a_forward * exp(alpha * n_e * F * eta / (R * T)) - a_reverse * exp(-(1-alpha) * n_e * F * eta / (R * T)))
    overpotential: eta = phi_s - phi_l - E_eq
    sign: Positive j_F is anodic oxidation; charge and atoms include produced electrons.
  - id: cell-homogeneous-reactions-v1
    expression: Source-traced mass-action rates in normalized concentrations, or Monod rate with declared substrate and half-saturation.
    domain: One explicitly tagged region per reaction.
  - id: cell-circuit-v1
    expression: MFC V = I * R_load; MEC V = -V_applied; I = minus outward anode collector current.
    power: Signed electrical power I*V; MEC electrical input -I*V, never generated energy.
assumptions:
  - Steady, isothermal, orthogonal structured layers; zero convection unless a complete sourced locally divergence-free superficial face velocity is supplied.
  - Prescribed velocity is not a hydraulic solution; no membrane convection/water transport or flow across outer collectors.
  - Fixed source-traced conductivity of an unmodeled supporting electrolyte; trace species do not determine total conductivity.
  - Continuous interface concentrations by default, with source-backed neutral partition permitted at explicitly selected membrane/separator interfaces; potential remains continuous and each shared face flux enters neighbors with opposite signs.
  - Volumetric electrode kinetics, not resolved electrode surface or pore/nanoscale transfer.
unsupported_physics:
  [
    full_electroneutral_species_closure,
    stokes_darcy_cell_flow_coupling,
    donnan_partition,
    fixed_membrane_charge,
    double_layer,
    biofilm_growth,
    gas_transport,
    heat_transport,
    multiscale_transfer,
  ]
verification: tests/contracts/test_spatial_structured_cell.py
independent_validation: absent
product_decision_eligibility: false
