version: 1
model_id: coupled-0d-dae-v1
scope:
  systems: [MFC, MEC]
  wastewater_role: dynamic COD treatment and bioelectrochemical energy or hydrogen conversion
  biosensor_role: standalone, MFC-integrated, and MEC-integrated amperometric response
  spatial_dimension: 0D_lumped
  executable_fidelity_id: coupled-0d-dae-v1
  reactor_assumption: lumped_well_mixed_two_compartment_with_profile_selected_continuous_or_closed_batch_boundary
  thermal_assumption: isothermal_fixed_boundary_temperature
  solver: explicit_RK4_for_differential_states_with_algebraic_electrochemical_current
  maximum_integration_steps: 2000
  maximum_output_points: 200

scientific_basis:
  statement: These publications support the model structure and selected balances; they do not supply default parameter values or validate this implementation.
  references:
    - id: hamelers-2011-bioanode-bv-monod
      citation: Hamelers et al. Butler-Volmer-Monod model for describing bio-anode polarization curves. Bioresource Technology 102(1), 381-387 (2011).
      doi: 10.1016/j.biortech.2010.06.156
      supports:
        [Monod-coupled bio-anode kinetics, Butler-Volmer charge transfer]
    - id: zeng-2010-two-chamber-mfc
      citation: Zeng et al. Modelling and simulation of two-chamber microbial fuel cell. Journal of Power Sources 195(1), 79-89 (2010).
      doi: 10.1016/j.jpowsour.2009.06.101
      supports:
        [dynamic mass and charge balance coupling, MFC load and polarization]
    - id: estrada-arriaga-2018-stacked-mfc
      citation: Estrada-Arriaga et al. Domestic wastewater treatment and power generation in continuous flow air-cathode stacked microbial fuel cell. Journal of Environmental Management 214, 232-241 (2018).
      doi: 10.1016/j.jenvman.2018.03.007
      supports:
        [
          a 40-unit continuous-flow air-cathode MFC stack treating domestic wastewater,
          the need to model series/parallel topology and its condition-specific electrical and treatment effects,
        ]
    - id: picioreanu-2010-spatial-mfc-biofilm
      citation: Picioreanu et al. Model based evaluation of the effect of pH and electrode geometry on microbial fuel cell performance. Bioelectrochemistry 78(1), 8-24 (2010).
      doi: 10.1016/j.bioelechem.2009.04.009
      supports:
        [
          coupling of time-dependent anode liquid balances with a spatial two-dimensional biofilm model,
          spatial pH and solute calculations beyond a lumped 0D state representation,
        ]
    - id: pinto-2011-unified-mfc-mec-model
      citation: Pinto et al. A unified model for electricity and hydrogen production in microbial electrochemical cells. IFAC Proceedings Volumes 44(1), 6084-6089 (2011).
      doi: 10.3182/20110828-6-IT-1002.01636
      supports:
        [shared anode kinetics with distinct MFC and MEC cathodic boundaries]
    - id: call-2009-mec-hydrogen-faradaic-balance
      citation: Call, Wagner and Logan. Hydrogen Production by Geobacter Species and a Mixed Consortium in a Microbial Electrolysis Cell. Applied and Environmental Microbiology 75(24), 7579-7587 (2009).
      doi: 10.1128/AEM.01760-09
      supports:
        [
          hydrogen recovery and coulombic efficiency are distinct measured outcomes,
          mixed-culture hydrogen recycling and methane formation can affect recovery,
        ]
    - id: multi-population-mec-validation
      citation: Multi-Population Model of a Microbial Electrolysis Cell. Environmental Science & Technology 45(11), 5039-5046 (2011).
      doi: 10.1021/es104268g
      supports:
        [
          a multi-population dynamic alternative to single-population kinetics,
          independent validation reported for its stated continuous-flow acetate or synthetic-wastewater conditions,
        ]
    - id: spurr-2021-bioelectrochemical-sensor-stability
      citation: Spurr et al. No re-calibration required? Stability of a bioelectrochemical sensor for biodegradable organic matter over 800 days. Biosensors and Bioelectronics 190, 113392 (2021).
      doi: 10.1016/j.bios.2021.113392
      supports:
        [
          MFC-integrated organic-load sensor calibration and long-term drift as validation fields under the reported operating conditions,
        ]
    - id: tardy-2021-mfc-bod-charge-sensor
      citation: Tardy et al. Microbial fuel cell biosensor for the determination of biochemical oxygen demand of wastewater samples containing readily and slowly biodegradable organics. Biotechnology Letters 43, 445-454 (2021).
      doi: 10.1007/s10529-020-03050-5
      supports:
        [
          a dynamic single-chamber air-cathode MFC method using voltage and integrated charge for BOD5,
          this protocol is not equivalent to the static amperometric calibration model,
        ]
    - id: salvian-2024-real-wastewater-mfc-biosensor
      citation: Salvian et al. Resilience of anodic biofilm in microbial fuel cell biosensor for BOD monitoring of urban wastewater. npj Clean Water 7, 53 (2024).
      doi: 10.1038/s41545-024-00350-5
      supports:
        [
          matrix-specific response and biofilm adaptation are relevant biosensor validation variables,
          single-chamber air-cathode configuration and non-sterile wastewater exposure,
        ]
    - id: sugioka-2019-tubular-mfc-sewage
      citation: Sugioka, Yoshida and Iida. On Site Evaluation of a Tubular Microbial Fuel Cell Using an Anion Exchange Membrane for Sewage Water Treatment. Frontiers in Energy Research 7, 91 (2019).
      doi: 10.3389/fenrg.2019.00091
      supports:
        [
          tubular module architecture and continuous wastewater operating conditions,
          leakage and depth-dependent behavior that the current lumped model cannot resolve,
        ]

state_variables:
  - {
      name: soluble_cod,
      unit: kgCOD/m3,
      balance: flow_in_minus_flow_out_minus_biological_uptake,
    }
  - {
      name: electroactive_biomass,
      unit: kgVSS/m3,
      balance: growth_minus_decay_minus_explicit_biomass_washout,
    }
  - {
      name: cathode_dissolved_oxygen,
      unit: kgO2/m3,
      balance: transfer_from_saturation_minus_oxygen_reduction,
    }
  - {
      name: anode_ph,
      unit: pH,
      balance: current_driven_proton_flux_buffering_and_inter_chamber_transfer,
    }
  - {
      name: cathode_ph,
      unit: pH,
      balance: current_driven_proton_flux_buffering_and_inter_chamber_transfer,
    }

algebraic_couplings:
  - biology: Monod COD uptake with biomass yield, decay, pH inhibition, and Arrhenius temperature response
  - electron_supply: coulombic_efficiency times electroactive_biofilm_fraction times COD electron equivalents (4 F per 32 g COD)
  - charge_transfer: full Butler-Volmer relation at both electrodes using source-backed electroactive-area factors
  - ionic_transport: electrode-gap electrolyte resistance, separator resistance using separator area, and contact resistance
  - cathode_transport: oxygen mass-transfer-limited current coupled to dissolved oxygen inventory
  - MFC_boundary: load-line intersection of reversible voltage, electrode polarization, ohmic loss, and external load
  - MEC_boundary: applied voltage minus reversible voltage, polarization, and ohmic loss; H2 production uses 2 F per mole H2 and separately reports Faradaic yield and gas capture
  - supply_limit_closure: when substrate/electron or cathode oxygen transfer caps current, expose the remaining load-line or applied-voltage residual as an algebraic closure residual; it is not assigned to a measured physical loss pathway
  - proton_balance: 1 mol proton per mole electron, chamber buffer capacity, and explicit transfer coefficient
  - loss_accounting: separately integrate anode and cathode activation polarization work, ohmic polarization work, auxiliary demand, and any stated biosensor demand; electrical-equivalent polarization work is not calorimetric heat
  - mass_accounting: integrate influent COD, effluent COD, modeled COD uptake, biomass growth, decay, washout, and numerical closure residuals using the same RK4 stage evaluations as the state solver
  - hydrogen_accounting: retain MEC gross Faradaic hydrogen, captured hydrogen, and their modeled difference as separate outputs; do not infer leak, crossover, dissolved gas, or collection mechanisms from that difference

required_parameter_source_fields:
  fields: [value, unit, source_kind, source_ref]
  uncertainty_when_available: true
  source_kinds: [measured, literature, default, assumption, test_fixture]
  rule: A missing source reference, dimensional mismatch, or absent boundary-condition parameter blocks execution. Defaults and assumptions must be explicitly typed and reduce confidence.

input_parameters:
  model_profile_id:
    unit: '1'
    required_when: a named configuration is selected
    rule: If omitted, preserve legacy coupled-0d-dae-v1 behavior. If present, it must identify a profile marked executable and agree with technology family and flow boundary; research-only profiles are blocked from execution.
  model_fidelity_id:
    unit: '1'
    required_when: a non-default dimensional or scale formulation is explicitly requested
    rule: Only coupled-0d-dae-v1 is executable. A 1D, 2D, 3D, stack-network, pore-scale, or nano-informed research selection returns insufficient_data and is never silently run through the 0D solver.
  component_model_parameters:
    required_when: a component-specific scale-resolved property is supplied or requested by a research profile
    parameter_contract:
      {
        value: number,
        unit: catalog-defined,
        source_kind: [measured, literature, default, assumption, test_fixture],
        source_ref: required,
      }
    catalog: bioelectrochem_agent_kit/domain/ontology/model-fidelity.yml#component_parameter_groups
    serialization_path: stack_blocks.component_model_parameters
    rule: The property ID and unit must match the component catalog. Properties remain design inputs and are not passed into the 0D equations unless an executable equation explicitly consumes them.
  biosensor.configuration_profile_id:
    unit: '1'
    required_when: a named biosensor deployment is selected
    rule: If present, it must be executable, amperometric, and match deployment_mode; the live-biofilm BOD research profile is not the static calibration model.
  geometry.anode_chamber_volume_m3: { unit: m3, required_when: always }
  geometry.cathode_chamber_volume_m3: { unit: m3, required_when: always }
  geometry.anode_area_m2: { unit: m2, required_when: always }
  geometry.cathode_area_m2: { unit: m2, required_when: always }
  geometry.electrode_gap_m: { unit: m, required_when: always }
  geometry.membrane_area_m2: { unit: m2, required_when: membrane_present }
  geometry.membrane_thickness_m: { unit: m, required_when: membrane_present }
  geometry.membrane_conductivity_s_m:
    { unit: S/m, required_when: membrane_present }
  materials.anode_electroactive_area_factor:
    { unit: '1', required_when: always }
  materials.cathode_electroactive_area_factor:
    { unit: '1', required_when: always }
  materials.biofilm_electroactive_fraction: { unit: '1', required_when: always }
  operation.flow_m3_s:
    unit: m3/s
    required_when: always
    rule: Positive for continuous-mixed profiles; exactly zero only for an executable batch profile.
  operation.influent_cod_kg_m3: { unit: kgCOD/m3, required_when: always }
  operation.temperature_k: { unit: K, required_when: always }
  operation.influent_ph: { unit: pH, required_when: always }
  operation.initial_ph_anode: { unit: pH, required_when: always }
  operation.initial_ph_cathode: { unit: pH, required_when: always }
  operation.initial_cod_kg_m3: { unit: kgCOD/m3, required_when: always }
  operation.initial_biomass_kg_m3: { unit: kgVSS/m3, required_when: always }
  operation.biomass_washout_rate_s_inv: { unit: 1/s, required_when: always }
  operation.initial_dissolved_oxygen_kg_m3:
    { unit: kgO2/m3, required_when: MFC }
  operation.oxygen_saturation_kg_m3: { unit: kgO2/m3, required_when: MFC }
  operation.electrolyte_conductivity_s_m: { unit: S/m, required_when: always }
  operation.auxiliary_power_w: { unit: W, required_when: always }
  operation.duration_s: { unit: s, required_when: always }
  operation.time_step_s: { unit: s, required_when: always }
  biology.max_specific_cod_uptake_kg_cod_kg_biomass_s:
    { unit: kgCOD/(kgVSS*s), required_when: always }
  biology.half_saturation_cod_kg_m3: { unit: kgCOD/m3, required_when: always }
  biology.biomass_yield_kg_biomass_kg_cod:
    { unit: kgVSS/kgCOD, required_when: always }
  biology.decay_rate_s_inv: { unit: 1/s, required_when: always }
  biology.coulombic_efficiency: { unit: '1', required_when: always }
  biology.ph_optimum: { unit: pH, required_when: always }
  biology.ph_tolerance: { unit: pH, required_when: always }
  biology.activation_energy_j_mol: { unit: J/mol, required_when: always }
  biology.reference_temperature_k: { unit: K, required_when: always }
  biology.buffer_capacity_anode_mol_m3_ph:
    { unit: mol/(m3*pH), required_when: always }
  biology.buffer_capacity_cathode_mol_m3_ph:
    { unit: mol/(m3*pH), required_when: always }
  biology.proton_transfer_coefficient_mol_s_ph:
    { unit: mol/(s*pH), required_when: always }
  electrochemistry.reversible_cell_voltage_v: { unit: V, required_when: always }
  electrochemistry.anode_exchange_current_density_a_m2:
    { unit: A/m2, required_when: always }
  electrochemistry.cathode_exchange_current_density_a_m2:
    { unit: A/m2, required_when: always }
  electrochemistry.anode_charge_transfer_coefficient:
    { unit: '1', required_when: always }
  electrochemistry.cathode_charge_transfer_coefficient:
    { unit: '1', required_when: always }
  electrochemistry.contact_resistance_ohm: { unit: ohm, required_when: always }
  electrochemistry.oxygen_mass_transfer_coefficient_m_s:
    { unit: m/s, required_when: MFC }
  electrochemistry.external_load_ohm: { unit: ohm, required_when: MFC }
  electrochemistry.applied_voltage_v: { unit: V, required_when: MEC }
  electrochemistry.hydrogen_faraday_efficiency:
    { unit: '1', required_when: MEC }
  electrochemistry.hydrogen_capture_fraction: { unit: '1', required_when: MEC }

biosensor_inputs:
  deployment_modes: [standalone, mfc_integrated, mec_integrated]
  required_metadata:
    - analyte_id
    - measurand
    - concentration_unit
    - matrix
    - recognition_element
    - transduction_mode
    - calibration_date
    - reference_method
    - working_range
    - sensitivity_or_binding_parameters
    - lod
    - loq
    - response_time
    - recovery_time
    - noise
    - drift
    - repeatability
    - accuracy
    - selectivity_and_interferences
    - power_draw_and_power_source
    - working_reference_and_counter_electrode_materials_and_area
    - immobilization_membrane_and_mediator
    - calibration_fit_quality_and_replicate_count
    - explicit_external_or_integrated_power_budget
  currently_executable_transduction: amperometric
  power_rules:
    - MFC harvested power is checked against simulated MFC output after sensor load.
    - MEC power_bus is an external electrical input and is never reported as generated power.
    - Standalone sensors require an explicit external supply with a source-backed power budget.
    - Integrated sensors are checked against MFC net output after auxiliary loads or the MEC external bus after cell and auxiliary loads.

not_yet_modeled:
  - spatial biofilm gradients and resolved porous-electrode transport
  - multiple competing microbial guilds and detailed metabolic pathways
  - nitrogen-species balances, alkalinity speciation, gas crossover and gas-transfer losses
  - thermal dynamics, dynamic ionic strength, membrane fouling, and multi-phase fluid flow
  - joint or probabilistic uncertainty propagation, parameter fitting, and posterior prediction

fidelity_selection_policy:
  catalog: bioelectrochem_agent_kit/domain/ontology/model-fidelity.yml
  axes:
    spatial_dimensions: [0, 1, 2, 3]
    resolution_scales: [macro, micro, nano]
    temporal_resolution_is_separate_from_spatial_dimension: true
  executable: [coupled-0d-dae-v1]
  research_only:
    - biofilm-1d-direct-transfer-research-v1
    - biofilm-2d-electrode-research-v1
    - cell-3d-multiphysics-research-v1
    - stack-network-macro-research-v1
    - porous-electrode-micro-3d-research-v1
    - electrode-interface-nano-research-v1
  rule: A multiscale profile must declare geometry, local properties, transport/reaction laws, boundary conditions, numerical verification, a scale-transfer map, and condition-matched independent observations before execution is offered. Catalogued literature supports model-form requirements only and does not validate METREV.

configuration_catalog:
  executable_profiles:
    - id: mfc-two-chamber-cstr-0d
      system: MFC
      flow_boundary: positive flow_m3_s
      model: coupled-0d-dae-v1
    - id: mfc-two-chamber-batch-0d
      system: MFC
      flow_boundary: flow_m3_s equals zero
      model: coupled-0d-dae-v1
    - id: mec-two-chamber-cstr-0d
      system: MEC
      flow_boundary: positive flow_m3_s
      model: coupled-0d-dae-v1
    - id: mec-two-chamber-batch-0d
      system: MEC
      flow_boundary: flow_m3_s equals zero
      model: coupled-0d-dae-v1
  executable_sensor_profiles:
    - id: biosensor-standalone-amperometric
      deployment_mode: standalone
    - id: biosensor-mfc-integrated-amperometric
      deployment_mode: mfc_integrated
    - id: biosensor-mec-integrated-amperometric
      deployment_mode: mec_integrated
  research_profiles_only:
    - mfc-single-chamber-air-cathode
    - mfc-tubular-membrane-wastewater
    - mfc-stacked-series-parallel
    - mfc-spatial-biofilm-electrode
    - mec-multipopulation-dynamic
    - mec-membraneless-gas-managed
    - biosensor-mfc-integrated-bod
  selection_rule: Research profiles organize literature and missing model capabilities. They are not runnable until the numerical formulation, parameter contract, test fixtures, and verification are implemented.

journal_ranking_policy:
  rule: A1-A4 is not a universal international ranking. If storing historical CAPES Qualis Periódicos, record the scheme, journal-vs-article object, evaluation area, cycle, journal ISSN, retrieval date, and official source. For CAPES 2025-2028, the object is the article, assessment procedures are area-specific, and strata can extend from A1 to A8. Never infer a classification from prestige, quartile, or an LLM; journal/article classification does not establish claim applicability or model validity.
  current_source_review: Peer-reviewed article records remain pending until a human reviewer verifies the exact source, claim locator, study design, applicability, and license.

sensitivity_analysis:
  method: one_at_a_time_reported_uncertainty_v1
  perturbation: nominal_minus_and_plus_reported_uncertainty_magnitude
  interpretation: Deterministic scenario response only; no probability distribution, joint uncertainty, or prediction interval is inferred.
  maximum_parameters_per_run: 16

data_policy:
  evidence_role: Literature/data warehouse may supply candidate parameter values only when units and source locators are retained.
  execution_gate: A source-backed case-level parameter set is required; literature averages are not silently substituted for case measurements.
  volume_target: none
