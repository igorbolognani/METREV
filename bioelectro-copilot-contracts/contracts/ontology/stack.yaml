version: 0.3
domain: bioelectrochemical-decision-support

canonical_entities:
  case:
    description: Normalized client or internal evaluation case.
    fields:
      case_id: string
      technology_family:
        type: enum
        allowed:
          [
            microbial_fuel_cell,
            microbial_electrolysis_cell,
            electrochemical_biosensor,
          ]
        historical_read_values: [microbial_electrochemical_technology]
        normalization_only_values: [unclassified]
      architecture_family: string
      primary_objective:
        type: enum
        allowed: [wastewater_treatment, biosensing]
        historical_read_values:
          [
            hydrogen_recovery,
            nitrogen_recovery,
            sensing,
            low_power_generation,
            biogas_synergy,
            other,
          ]
        normalized_active_values: [wastewater_treatment, biosensing]
      business_context: object
      technology_context: object
      feed_and_operation: object
      mechanistic_model: object
      stack_blocks: object
      cross_cutting_layers: object

    nested_fields:
      business_context:
        decision_horizon: string
        deployment_context: string
        capex_constraint_level: string
        opex_sensitivity_level: string
        retrofit_priority: string
        serviceability_priority: string

      technology_context:
        scale_context: string
        current_trl: number
        current_pain_points: list[string]
        performance_claims_under_review: list[string]
        target_maturity_window: string

      feed_and_operation:
        influent_type: string
        substrate_profile: string
        pH: number
        temperature_c: number
        hydraulic_retention_time_h: number
        salinity_or_conductivity_context: string
        operating_regime: string
        water_quality:
          cod_mg_cod_l: object
          bod5_mg_o2_l: object
          tss_mg_l: object
          alkalinity_mol_m3: object
          total_nitrogen_mg_n_l: object
          ammonium_mg_n_l: object
          nitrate_mg_n_l: object
          total_phosphorus_mg_p_l: object
          sulfate_mg_s_l: object
          chloride_mg_l: object
          salinity_kg_m3: object
          turbidity_ntu: object
          volatile_fatty_acids_mol_m3: object
          dissolved_oxygen_mg_l: object
          temperature_c: object
          ph: object
          conductivity_ms_per_cm: object
          sample_method: string
          sampling_point: string
          filtered_or_total: string

      stack_blocks:
        reactor_architecture:
          architecture_type: string
          solids_tolerance: string
          serviceability_level: string
        anode_biofilm_support:
          material_family: string
          surface_treatment: string
          biofilm_support_level: string
        cathode_catalyst_support:
          reaction_target: string
          catalyst_family: string
          mass_transport_limitation_risk: string
          gas_handling_interface: string
        membrane_or_separator:
          type: string
          fouling_risk: string
          crossover_control_level: string
        electrical_interconnect_and_sealing:
          current_collection_strategy: string
          sealing_strategy: string
          corrosion_protection_level: string
        balance_of_plant:
          flow_control: string
          gas_handling_readiness: string
          dosing_capability: string
        sensors_and_analytics:
          data_quality: string
          voltage_current_logging: string
          water_quality_coverage: string
          biosensor:
            deployment_mode: string
            power_source: string
            analyte_id: string
            measurand: string
            concentration_unit: string
            matrix: string
            recognition_element: string
            working_electrode_material: string
            reference_electrode_material: string
            counter_electrode_material: string
            electrode_material_source_ref: string
            electrode_immobilization_method: string
            electrode_coating_or_membrane: string
            electron_transfer_mediator: string
            working_electrode_area_m2: object
            biorecognition_loading_mg_cm2: object
            ionic_strength_mol_m3: object
            transduction_mode: string
            concentration: object
            temperature_k: object
            ph: object
            calibration:
              model: string
              sensitivity_a_per_unit: object
              intercept_a: object
              maximum_current_a: object
              half_saturation_concentration: object
              calibration_date: string
              reference_method: string
              range_min: object
              range_max: object
            analytical_performance:
              lod: object
              loq: object
              response_time_s: object
              recovery_time_s: object
              noise_std_a: object
              drift_a_per_day: object
              repeatability_cv_pct: object
              accuracy_pct: object
              selectivity_pct: object
              interferences: list[string]
              calibration_r2: object
              replicate_count: object
            power_consumption_w: object
            power_available_w: object
        operational_biology:
          biofilm_maturity: string
          contamination_risk: string
          inoculum_source: string
          startup_protocol: string

      cross_cutting_layers:
        technoeconomics:
          maintenance_burden: string
          capex_constraint_level: string
          opex_sensitivity_level: string
        evidence_and_provenance:
          evidence_profile: string
          supplier_claim_fraction: string
        risk_and_maturity:
          trl: number
          scale_up_risk: string
          serviceability_risk: string

stack_blocks:
  reactor_architecture:
    description: Physical and functional reactor configuration.
  anode_biofilm_support:
    description: Anodic substrate, geometry, and biofilm-supporting environment.
  cathode_catalyst_support:
    description: Cathodic substrate, catalyst family, and interface conditions.
  membrane_or_separator:
    description: Ion transport and crossover-management layer.
  electrical_interconnect_and_sealing:
    description: Current collection, contacts, sealing, and anti-corrosion interfaces.
  balance_of_plant:
    description: Pumps, gas handling, dosing, recirculation, and auxiliary hardware.
  sensors_and_analytics:
    description: Instrumentation and electrochemical biosensors, including standalone and reactor-integrated deployments.
    fields:
      - biosensor_definition
      - calibration
      - analytical_performance
      - power_budget
  operational_biology:
    description: Inoculum, startup behavior, microbial resilience, and biological operating regime.

cross_cutting_layers:
  technoeconomics:
    description: CAPEX, OPEX, replacement cycles, and implementation economics.
  evidence_and_provenance:
    description: Evidence quality, provenance, applicability, and contradiction handling.
  risk_and_maturity:
    description: TRL, scale-up risk, serviceability risk, and deployment readiness.
