      - trl
      - metadata

  supplier_document:
    required_fields:
      - id
      - supplier_id
      - source_document_id
      - document_type
    optional_fields:
      - product_id
      - note

  evaluation_lineage:
    source_usage_required_fields:
      - id
      - evaluation_id
      - source_document_id
      - usage_type
      - created_at
    source_usage_optional_fields:
      - note
      - runtime_versions
    claim_usage_required_fields:
      - id
      - evaluation_id
      - claim_id
      - usage_type
      - created_at
    claim_usage_optional_fields:
      - note
      - runtime_versions

  evidence_decision_context:
    required_fields:
      - id
      - evaluation_id
      - case_id
      - context_version
      - builder_version
      - query
      - benchmark_ranges
      - matched_evidence
      - material_comparisons
      - operating_window_signals
      - failure_mode_signals
      - cost_signals
      - supplier_signals
      - uncertainty_summary
      - source_refs
      - excluded_evidence_summary
      - created_at
