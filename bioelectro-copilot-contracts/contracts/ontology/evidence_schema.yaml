      - reviewed_claim_count
      - accepted_by
      - acceptance_policy
      - accepted_at
      - review_required
      - ingestion_mode
      - ingestion_batch_id
      - extraction_status
      - normalization_status
      - evidence_quality
      - duplicate_decision
      - decision_support_metadata

  ingestion_audit:
