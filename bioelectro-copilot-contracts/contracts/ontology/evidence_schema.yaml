      - source_record_id
      - title
      - review_status
      - source_state
      - access_status
      - canonical_key
      - metric_type
      - normalized_value
      - normalized_unit
      - evidence_quality
      - source_text_hash
      - source_locator
    admissibility_required_state:
      review_status: accepted
      source_state: reviewed
      access_status_excludes:
        - closed
      evidence_quality_excludes:
        - low
      supplier_claims: exclude_from_scoring_unless_independently_corroborated

  workspace_snapshot:
    required_fields:
      - id
      - snapshot_type
      - payload
      - created_at
    optional_fields:
      - evaluation_id
      - case_id
      - runtime_versions

api_payloads:
  external_evidence_catalog_summary:
    required_fields:
      - id
      - title
      - summary
      - evidence_type
      - strength_level
      - review_status
      - source_state
      - source_type
      - provenance_note
      - applicability_scope
      - extracted_claims
      - tags
      - created_at
      - updated_at
    optional_fields:
      - source_category
      - source_url
      - doi
      - publisher
      - published_at
      - claim_count
      - reviewed_claim_count
      - accepted_by
      - acceptance_policy
      - accepted_at
      - review_required
      - ingestion_mode
      - ingestion_batch_id
      - extraction_status
      - normalization_status
      - evidence_quality

  external_evidence_catalog_detail:
    inherited_from:
      - external_evidence_catalog_summary
    required_fields:
      - source_document
      - claims
      - supplier_documents
      - payload
      - raw_payload
    optional_fields:
      - abstract_text

  external_evidence_catalog_list_response:
    required_fields:
      - items
      - summary
    summary_required_fields:
      - catalog_total
      - accepted
      - pending_review
      - rejected
      - failed_ingestion
      - duplicate_skipped
      - last_ingestion_batch
      - ingestion_progress

  external_evidence_bulk_review_request:
    required_fields:
      - ids
      - action
    optional_fields:
      - note

  external_evidence_bulk_review_response:
    required_fields:
      - action
      - attempted_ids
      - succeeded_ids
      - failed
    optional_fields:
      - note

enums:
  evidence_type:
    allowed:
      - literature_evidence
      - internal_benchmark
      - supplier_claim
      - engineering_assumption
      - derived_heuristic

  review_status:
    allowed: [pending, accepted, rejected]

  source_state:
    allowed: [raw, parsed, normalized, reviewed]

  source_type:
    allowed:
      - openalex
      - crossref
      - europe_pmc
      - paper
      - review
      - patent
      - datasheet
      - manual_sop
      - technical_report
      - supplier_document
      - supplier_profile
      - case_study
      - market_report
      - market_snapshot
      - regulatory_report
      - curated_manifest
      - manual

  access_status:
    allowed: [gold, green, hybrid, bronze, closed, unknown]

  claim_type:
    allowed:
      - metric
      - material
      - architecture
      - condition
      - limitation
      - applicability
      - economic
      - supplier_claim
      - market_signal
      - other

  extraction_method:
    allowed: [manual, llm, regex, ml, import_rule]

  ontology_mapping_source:
    allowed: [auto, analyst, import_rule]

  supplier_document_type:
    allowed:
      - profile
      - datasheet
      - specification
      - certificate
      - market_brief
      - case_study
      - patent_filing
      - report
      - other

  usage_type:
    allowed:
      - attached_input
      - input_support
      - diagnostic_support
      - recommendation_support
      - supplier_support
      - report_citation

  workspace_snapshot_type:
    allowed:
      - dashboard
      - evaluation
      - comparison
      - history
      - evidence_review
      - report
      - export_json
      - export_csv

rules:
  - Supplier claims must never be presented as validated fact without corroboration and explicit review status.
  - Catalog items remain intake-gated until review_status is accepted; parsed or normalized records alone are not intake-ready.
  - Claim extraction must keep source_snippet, extraction_method, and extractor_version explicit so downstream confidence can be challenged.
  - Claim reviews must preserve analyst identity, role, note, and review timestamp when human acceptance posture changes.
  - Ontology mappings remain advisory unless their mapping confidence and mapped_by provenance are preserved.
  - Supplier product records must stay linked to supplier identity and must not bypass source-document provenance when shown in registry or report flows.
  - Evaluation lineage must preserve which source documents and claims were used, not only the flattened typed evidence snapshot.
  - Workspace and export snapshots must keep immutable payloads for replay and audit instead of silently rebuilding historical state from mutable live records.
  - External evidence list, detail, and bulk-review API payloads remain part of the validation-facing contract boundary when they carry review posture or provenance semantics.
  - EvidenceDecisionContext is the validation-facing boundary between canonical evidence retrieval and deterministic decision scoring.
  - Only accepted, normalized, decision-ready evidence with traceable source locator or span may affect benchmark-backed scoring.
  - Supplier claims without independent corroboration may appear as supplier signals but must not increase validated evidence confidence.
