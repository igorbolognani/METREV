      - source_category
      - doi
      - publisher
      - journal
      - authors
      - language
      - license
      - access_status
      - published_at
      - as_of
      - pdf_url
      - xml_url
      - abstract_text
      - hash_dedup
      - normalized_title
      - publication_year
      - first_author
      - source_identifier
      - content_hash
      - metadata_hash
      - ingestion_run_id

  catalog_item:
    required_fields:
      - id
      - source_document_id
      - evidence_type
      - title
      - summary
      - strength_level
      - provenance_note
      - review_status
      - source_state
      - applicability_scope
      - extracted_claims
      - tags
      - payload
    optional_fields:
