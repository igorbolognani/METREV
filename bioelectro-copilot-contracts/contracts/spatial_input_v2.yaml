version: spatial-input-v2
scope: Planar Cartesian 2D input metadata. Parsing does not execute a spatial model.
runtime_validator: packages/domain-contracts/src/spatial-model-v2-schema.ts
scientific_authority:
  material_fields: bioelectrochem_agent_kit/domain/ontology/spatial-parameter-authority.json
  state_and_boundary_units: bioelectrochem_agent_kit/domain/ontology/spatial-variable-authority.json
required_fields:
  - contract_version
  - model_id
  - system
  - dimension
  - coordinate_system
  - axes
  - geometry
  - mesh
  - material_fields
  - species
  - variables
  - reaction_laws
  - initial_conditions
  - boundary_conditions
  - circuit
  - requested_outputs
optional_fields:
  - vector_outputs
  - stokes_development
  - darcy_development
  - darcy_transport_development
  - stokes_transport_development
scientific_value:
  required: [value, unit, source_kind, source_ref]
  optional: [source_locator, conditions, uncertainty, uncertainty_unit]
  source_kinds: [measured, literature, default, assumption, test_fixture]
geometry:
  version: planar-layers-v1
  dimension: 2
  coordinates: { system: cartesian, axes: [x, y] }
  required: [height_m, layers, boundaries, target_size_m, refinement_factors]
  layer_required: [tag, kind, width_m]
  layer_optional: [component_id, target_size_m]
  local_refinement: A layer target_size_m is a positive source-traced length in m no larger than the global target_size_m; the finest refinement-factor mesh estimate remains bounded and neighboring layers share the finer interface point size.
  boundary_sides: [left, right, top, bottom]
  boundary_roles: [wall, inlet, outlet, electrode]
  interface_normal: [1, 0]
  property_ownership:
    material: region tag
    species: species ID
    state: variable ID and one or more region tags
    reaction: region tag and declared stoichiometry
    interface: adjacent ordered layer pair
mesh:
  kind: generated_mesh
  format: msh4
  required:
    - uri
    - sha256
    - refinement_factor
    - input_sha256
    - request
    - sidecar_version
    - gmsh_version
    - physical_groups
    - component_map
    - interfaces
  admission: Keep the exact sidecar request alongside the manifest; compare its complete geometry to the case and verify its serialized SHA-256 against the response through the Node sidecar client. The artifact store must separately authorize and verify URI/hash before a numerical run.
fields:
  forms: [constant, piecewise, sampled, artifact]
  artifact_formats: [XDMF, HDF5, VTU]
  validation: Canonical units and bounds; piecewise tags within owned domains; sample coordinates inside their physical region.
vector_outputs:
  form: An optional id and ordered x/y component variable IDs; x must name velocity_x and y velocity_y, both in the same canonical unit with at least one shared eligible region. Vector IDs cannot shadow state IDs.
  admission: requested_outputs may name a scalar state or a declared vector view; every requested output must appear in an input-bound result.
species:
  required: [id, valence, molecular_diffusivity]
  optional:
    [effective_diffusivity, ion_mobility, henry_coefficient, gas_solubility]
  rule: An optional property is supplied with provenance; no mobility, Henry coefficient or effective diffusivity is silently derived.
reaction_laws:
  required:
    [id, domain_tag, equation_ref, stoichiometry, electron_count, proton_count]
  rule: At least one reactant and product with distinct declared species; electron and proton counts are explicit sourced integers. Mass and charge balance need chemical formulas and a later scientific gate.
boundary_kinds:
  exterior_with_value: [dirichlet, neumann, flux, robin]
  exterior_without_value: [symmetry, circuit_coupling]
  internal: [interface_continuity]
  rule: A tag must be a physical facet or ordered interface, never a region. Units and supported operators come from state_and_boundary_units.
stokes_development:
  optional: true
  regime: steady_stokes
  scope: One bulk-liquid-only planar mesh; no porous or electrode coupling and no product solver admission.
  required:
    [
      regime,
      equation_ref,
      domain_tag,
      viscosity_parameter_id,
      pressure_variable,
      velocity_variables,
      wall_tags,
      inlet,
      outlet,
    ]
  equation_ref: EQ-FL-002 in docs/numerics/GOVERNING_EQUATIONS.md; steady incompressible symmetric-stress Stokes momentum and continuity.
  viscosity: A source-traced constant dynamic_viscosity_pa_s material field on the sole bulk-liquid region; no inferred liquid properties.
  states: Requested pressure, velocity_x and velocity_y variables declared only on that region; no overlapping generic state boundary conditions.
  facets: Exactly two exterior walls, one inlet and one outlet matching the planar geometry and tagged mesh.
  port_traction: Explicit x/y full Cauchy traction components σ·n, where n is the outward liquid normal, with unit Pa and source provenance at both inlet and outlet; enter the weak-form right hand side with positive sign. Zero traction is allowed.
darcy_development:
  optional: true
  regime: steady_darcy
  scope: One homogeneous porous anode, biofilm or separator layer; no bulk/porous coupling, heterogeneous permeability or product solver admission.
  required:
    [
      regime,
      equation_ref,
      domain_tag,
      viscosity_parameter_id,
      permeability_parameter_id,
      pressure_variable,
      velocity_variables,
      inlet,
      outlet,
    ]
  equation_ref: EQ-FL-003 in docs/numerics/GOVERNING_EQUATIONS.md; steady incompressible Darcy flow with constant isotropic permeability and viscosity.
  material_fields: Source-traced constant dynamic_viscosity_pa_s and hydraulic_permeability_m2 values on the same porous domain, with units Pa*s and m2.
  states: Requested pressure, velocity_x and velocity_y variables declared only on that region; no overlapping generic state boundary conditions.
  facets: Exactly two opposing exterior pressure ports, one inlet and one outlet matching geometry, and two no-flow wall facets.
  port_pressure: Explicit source-backed pressure_pa values with unit Pa at both inlet and outlet; equal pressure is the zero-flow limiting case.
darcy_transport_development:
  optional: true
  requires: darcy_development
  regime: steady_advection_diffusion
  scope: One homogeneous porous region carrying one neutral passive scalar; no reactions, electromigration, bulk coupling or product solver admission.
  required:
    [
      regime,
      equation_ref,
      domain_tag,
      species_id,
      concentration_variable,
      velocity_variables,
      inlet,
      outlet,
    ]
  equation_ref: EQ-SP-001 with zero reaction and no electromigration; Darcy superficial velocity is transferred from the exact same-domain Darcy solve.
  material: The declared species has source-traced constant positive effective_diffusivity in m2/s and zero valence.
  states: Requested species concentration and x/y velocity states are bound to one porous region; transport velocity IDs must equal the Darcy output IDs.
  facets: Nonnegative source-backed inlet and outlet concentrations use the matching positive-flow Darcy ports; two other exterior facets are impermeable walls.
  verification: Pinned planar fixture compares concentration with the homogeneous 1D advection-diffusion solution and checks integrated species flux balance; no cell-scale biological kinetics are inferred.
stokes_transport_development:
  optional: true
  requires: stokes_development
  regime: steady_advection_diffusion
  scope: One homogeneous bulk-liquid region carrying one neutral passive scalar; no reactions, electromigration, porous coupling or product solver admission.
  required:
    [
      regime,
      equation_ref,
      domain_tag,
      species_id,
      concentration_variable,
      velocity_variables,
      inlet,
      outlet,
    ]
  equation_ref: EQ-SP-001 with zero reaction and no electromigration; Stokes P2 velocity is transferred from the exact same-domain Darcy solve.
  material: The declared species has source-traced constant positive effective_diffusivity in m2/s and zero valence.
  states: Requested species concentration and x/y velocity states are bound to one bulk-liquid region; transport velocity IDs must equal the Stokes output IDs.
  facets: Nonnegative source-backed inlet and outlet concentrations use the matching opposing Stokes ports; zero flow is admitted and reverse flow is rejected at runtime; two other exterior facets are impermeable walls.
  verification: Pinned planar fixture compares concentration with the zero-flow affine diffusion solution; a solved Poiseuille velocity transports a constant tracer across three mesh refinements and checks integrated species flux balance; no cell-scale biological kinetics are inferred.
circuit:
  MFC: { kind: external_load, unit: ohm, sign: generated_power }
  MEC: { kind: applied_voltage, unit: V, sign: consumed_electrical_power }
compatibility:
  persisted_0d: Retains its existing normalized case contract and reader; spatial-input-v2 is opt-in and has no 0D migration.
  spatial_input_v1: Continues to parse as a legacy research data contract; no automatic upgrade without physical geometry.
  runtime: A valid v2 payload is not eligible for 2D execution until the solver, numerical verification, artifact authorization and case runner gates pass.
