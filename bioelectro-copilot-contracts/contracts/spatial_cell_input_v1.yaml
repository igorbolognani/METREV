version: spatial-cell-input-v1
model_id: structured-cell-supporting-electrolyte-v1
scope: Opt-in development model; steady Cartesian 2D and 3D with declared supporting electrolyte.
runtime_validator: packages/domain-contracts/src/structured-cell-schema.ts
scientific_authority: bioelectrochem_agent_kit/domain/ontology/structured-cell-equations.yaml
required_fields:
  [
    contract_version,
    model_id,
    system,
    dimension,
    coordinate_system,
    charge_model,
    geometry,
    temperature,
    reservoir_faces,
    species,
    reactions,
    electrodes,
    circuit,
    numerics,
  ]
scientific_value:
  required: [value, unit, source_kind, source_ref]
  optional: [source_locator, conditions, uncertainty, uncertainty_unit]
  source_kinds: [measured, literature, default, assumption, test_fixture]
optional_case_context:
  version: structured-cell-case-context-v1
  runtime_projection: packages/domain-contracts/src/structured-cell-case-context.ts
  authority: Authenticated saved-evaluation service assigns case/evaluation IDs and canonical normalized-case hash; clients cannot assert this binding.
  mapping: Explicit complete compatible layer-to-stack-block mapping; no scientific parameters inferred from 0D.
  eligibility: Development only; decision_eligible is false.
optional_advection:
  version: structured-cell-prescribed-flow-v1
  kind: Explicit source-backed prescribed superficial face-normal velocity; no hydraulic field inferred or solved.
  required:
    [
      version,
      face_normal_velocity,
      boundary_normal_velocity,
      inlet_concentrations,
    ]
  velocity_unit: m/s
  ordering: packages/domain-contracts/src/structured-cell-topology.ts#structuredCellTransportFaces matches Python numpy.ndindex cell-major, axis-major ordering.
  interior_orientation: Positive from left_cell to right_cell along the positive coordinate axis.
  exterior_orientation: Positive outward from cell, negative entering from sourced inlet concentration.
  inlet_concentrations: Exactly every flowing inlet face name and every declared species, in mol/m3 with provenance.
  constraints: Every mesh face requires an explicit velocity including zero walls; local incompressible volume conservation must pass. Exterior x collectors and all membrane-incident faces are impermeable.
  diffusive_boundary: reservoir_faces retain explicitly selected concentration boundaries independently of advective inlet/outlet flux. Unselected exterior faces have zero diffusive flux.
  discretization: Conservative first-order upwind; each interior molar flux enters adjacent cells with opposite signs, exterior species budgets include both diffusion and convection.
  compatibility: Absent advection retains the zero-convection input behavior. Queue/runtime protocol v4 prevents older workers from silently ignoring prescribed flow.
optional_interface_partition:
  versions:
    - structured-cell-neutral-membrane-partition-v1
    - structured-cell-ideal-donnan-partition-v1
  required: [version, interfaces]
  interface:
    required_neutral: [left_domain, right_domain, species]
    required_donnan: [left_domain, right_domain, fixed_charge_density, species]
    orientation: left_domain and right_domain must be adjacent in positive-x layer order. The neutral coefficient is right/left concentration at zero flux. Donnan interfaces identify a solution and exactly one ion-exchange membrane side.
    neutral_domains: At least one side must be a membrane or porous separator.
    donnan_domains: Exactly one side must be kind membrane; porous separators do not receive Donnan closure.
    species: Every charged species requires a positive, source-backed dimensionless partition coefficient; valence magnitude is bounded by four. Neutral species may be selected optionally.
    provenance: fixed_charge_density in mol/m3 and every partition coefficient retain value, unit, source_kind, and source_ref.
  discretization_neutral: For half-cell distances h_L/h_R, diffusivities D_L/D_R, face area A, and partition ratio K_RL, J=A*(c_L-c_R/K_RL)/(h_L/D_L+h_R/(K_RL*D_R)); the same flux is added and subtracted on the two cells.
  discretization_donnan: At each face, solve X+sum_i(z_i*K_i*c_i,solution*exp(-z_i*psi_D))=0 with psi_D=F*(phi_membrane-phi_solution)/(R*T). The ideal membrane equilibrium concentration is K_i*c_i,solution*exp(-z_i*psi_D). The oriented local jump enters Scharfetter-Gummel trace-species flux, with an exact Jacobian and opposite conservative cell contributions; the separate fixed-conductivity supporting-electrolyte current uses its continuous bulk potential only.
  limitations: Interface-local ideal activities and prescribed fixed charge only; no full membrane-volume electroneutral Nernst-Planck closure, activity coefficients, porous-separator Donnan partition, membrane-normal convection/water transport, swelling, or fouling.
  compatibility: Absence retains continuous-concentration diffusion. Queue/runtime protocol v9 identifies neutral and charged Donnan interface support and prevents older workers from silently ignoring this input.
geometry:
  version: structured-layers-v1
  dimensions: [2, 3]
  coordinates: cartesian
  required: [geometry_version, lengths_m, transverse_cells, layers]
  planar_only_required: [out_of_plane_depth]
  layers: Ordered anode, internal regions, cathode; all widths sum to x length.
  interfaces: Shared Cartesian faces with continuous concentrations and supporting-electrolyte bulk potential by default; explicitly declared neutral membrane/separator species or ion-exchange-membrane Donnan interfaces may use their versioned laws.
species:
  required:
    [
      id,
      valence,
      elements,
      initial_concentration,
      reservoir_concentration,
      reference_concentration,
    ]
  concentration_unit: mol/m3
  valence_unit: '1'
  elements: Nonempty atom inventory, nonnegative integer counts.
reactions:
  homogeneous_laws: [mass_action, monod]
  balances: Atoms and charge conserved; electrode stoichiometry explicitly produces electron_count electrons in the anodic orientation.
charge:
  model: fixed-conductivity-supporting-electrolyte
  note: Trace-species migration and independent total Ohmic liquid current. This is not a full electroneutral Nernst-Planck closure.
circuit:
  MFC: Positive external resistance in ohm.
  MEC: Positive applied voltage in V, imposed as negative cathode-minus-anode collector voltage.
results:
  version: spatial-simulation-result-v3
  artifacts: Hash-bound JSON cell fields and actual structured numerical mesh, owner-scoped access.
  failed_solve: Retain verified fields and conservation diagnostics; no completed status when tolerances fail.
  energy: Signed current times voltage; separately tagged MFC generation and MEC electrical input.
  termination: Explicit nonlinear/conservation success or evaluation budget, linear solve, nonfinite step, positivity, line search or conservation gate failure.
  equation_graph:
    version: structured-cell-equation-graph-v1
    runtime_projection: packages/domain-contracts/src/structured-cell-equation-graph.ts
    scope: Fixed-profile assembly metadata, equation IDs, domain/state units, input parameter paths, interfaces and couplings; not a general symbolic PDE compiler.
    binding: Optional for legacy compatibility; when present it must equal the graph compiled from the admitted immutable input.
  development_report:
    version: spatial-cell-development-report-v1
    runtime_projection: packages/domain-contracts/src/structured-cell-development-report.ts
    formats: [json, markdown]
    decision_eligible: false
    contents: Source-backed input, geometry, external artifact hashes and summaries, circuit, convergence, conservation, unsupported physics and failed diagnostic role.
    verification: Never infer per-run mesh convergence or independent validation from a fixture.
compatibility: Existing input v2 and result v1/v2 remain supported. Never substitute dimension or executor.
