version: 0.2
canonical_vocabulary_source:
  evidence: bioelectro-copilot-contracts/contracts/ontology/evidence_schema.yaml
evidence_scoring:
  dimensions:
    source_rigor:
      scale: [1, 2, 3, 4, 5]
    relevance_to_case:
      scale: [1, 2, 3, 4, 5]
    measurement_quality:
      scale: [1, 2, 3, 4, 5]
    comparability_after_normalization:
      scale: [1, 2, 3, 4, 5]
    recency_or_context_fitness:
      scale: [1, 2, 3, 4, 5]
    metadata_completeness:
      scale: [1, 2, 3, 4, 5]
    extraction_trace_quality:
      scale: [1, 2, 3, 4, 5]
    review_posture:
      scale: [1, 2, 3, 4, 5]
  aggregation:
    method: weighted_average
    default_weights:
      source_rigor: 0.25
      relevance_to_case: 0.20
      measurement_quality: 0.15
      comparability_after_normalization: 0.10
      recency_or_context_fitness: 0.10
      metadata_completeness: 0.15
      extraction_trace_quality: 0.10
      review_posture: 0.05
  decision_context_rules:
    material_alternative_recommendation:
      required_conditions:
        - comparable_system_type
        - comparable_component_type
        - alternative_material_median_at_least_15_percent_above_current_material_or_baseline
        - record_count_greater_or_equal_3
        - evidence_quality_not_low
        - decision_ready_true
      effect:
        - add_or_raise_recommendation_priority
        - cite_benchmark_ranges_in_provenance
        - keep_missing_validation_actions_explicit
    weak_or_conflicting_evidence:
      required_conditions:
        - low_record_count_or_low_confidence_coverage_or_conflict_flags
      effect:
        - lower_confidence
        - add_next_test_or_measurement_action
    supplier_claim_handling:
      rule: supplier_claims_without_independent_corroboration_do_not_increase_confidence
